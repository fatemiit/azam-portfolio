name: Sync from Framer

# Pulls the published Framer site into the repo and commits it.
# GitHub Pages then serves the repo (Settings → Pages → Deploy from branch → main / root).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # daily

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash _tools/sync.sh
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Sync from Framer" && git push)
