name: Mirror Framer site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # daily, picks up new Framer publishes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SOURCE_URL: https://azamesmaili.framer.website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror the published Framer site
        run: |
          mkdir -p site
          cd site
          for path in "" about case-studies experience case-studies/okala-out-of-stock case-studies/nobitex-shortcuts; do
            mkdir -p "./$path"
            curl -fsSL "$SOURCE_URL/$path" -o "./$path/index.html"
          done
          # Point internal links at our own domain instead of framer.website
          grep -rl "$SOURCE_URL" . | xargs -r sed -i "s#$SOURCE_URL##g"
          cp ./index.html ./404.html
          if [ -f ../CNAME ]; then cp ../CNAME ./CNAME; fi
          touch .nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
